name: Deployed dependency health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.DEPLOYED_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify app, database, OCR, and LLM
        env:
          API_URL: ${{ vars.DEPLOYED_API_URL }}
        run: |
          response="$(curl --fail --silent --show-error --max-time 15 "$API_URL/api/health")"
          echo "$response" | jq -e '
            .status == "ok" and
            .checks.app.status == "ok" and
            .checks.database.status == "ok" and
            .checks.ocr.status == "ok" and
            .checks.llm.status == "ok"
          ' >/dev/null
