name: Deployed dependency health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.DEPLOYED_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify app, database, OCR, and LLM
        env:
          API_URL: ${{ vars.DEPLOYED_API_URL }}
          HEALTH_ATTEMPTS: "3"
          HEALTH_RETRY_DELAY_SECONDS: "5"
        run: |
          set -euo pipefail

          for attempt in $(seq 1 "$HEALTH_ATTEMPTS"); do
            if response="$(curl --silent --show-error --max-time 15 --write-out $'\n%{http_code}' "$API_URL/api/health")"; then
              body="${response%$'\n'*}"
              http_status="${response##*$'\n'}"

              if echo "$body" | jq -e 'type == "object" and (.checks | type == "object")' >/dev/null 2>&1; then
                core_ok="$(echo "$body" | jq -r '.checks.app.status == "ok" and .checks.database.status == "ok"')"
                dependencies_ok="$(echo "$body" | jq -r '.checks.ocr.status == "ok" and .checks.llm.status == "ok"')"
                summary="$(echo "$body" | jq -c '{status, checks: (.checks | with_entries(.value |= {status, error_type}))}')"

                if [[ "$http_status" == "200" && "$core_ok" == "true" && "$dependencies_ok" == "true" ]]; then
                  echo "Health check passed on attempt $attempt/$HEALTH_ATTEMPTS."
                  exit 0
                fi

                if [[ "$core_ok" != "true" ]]; then
                  scope="core app/database"
                elif [[ "$dependencies_ok" != "true" ]]; then
                  scope="OCR/LLM dependency"
                else
                  scope="HTTP/status contract"
                fi
                echo "::warning::Health attempt $attempt/$HEALTH_ATTEMPTS reported $scope degradation (HTTP $http_status): $summary"
              else
                echo "::warning::Health attempt $attempt/$HEALTH_ATTEMPTS returned an invalid response (HTTP $http_status)."
              fi
            else
              echo "::warning::Health attempt $attempt/$HEALTH_ATTEMPTS could not reach the API."
            fi

            if [[ "$attempt" -lt "$HEALTH_ATTEMPTS" ]]; then
              sleep "$HEALTH_RETRY_DELAY_SECONDS"
            fi
          done

          echo "::error::Deployed health remained degraded after $HEALTH_ATTEMPTS attempts."
          exit 1
