name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d db
      - run: docker compose build api
      - run: docker compose run --rm -e RAILS_ENV=test api sh -lc "bundle exec rails db:prepare && bundle exec rspec"
      - run: docker compose run --rm api bundle exec rubocop
      - run: docker compose run --rm api bundle exec brakeman --no-pager --exit-on-warn
      - run: docker compose run --rm api bundle exec bundler-audit check --update
      - run: docker compose run --rm api bundle exec rake ai:eval
